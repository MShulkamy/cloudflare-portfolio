<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css?v=20260912">
    <link rel="stylesheet" href="login.css">
    <link rel="manifest" href="/dashboard/manifest.webmanifest">
    <meta name="theme-color" content="#0b0e14">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=3">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-logo"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h4 fw-bold mb-1" id="login-title">Dashboard Login</h1>
            <p class="text-muted small mb-0" id="login-subtitle">Sign in to manage your portfolio</p>
        </div>

        <div id="login-alert" class="alert d-none py-2 small" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="mb-3">
                <label class="form-label" for="login-email">Email</label>
                <input type="email" class="form-control" id="login-email" required autocomplete="username" placeholder="you@email.com">
            </div>
            <div class="mb-3">
                <label class="form-label" for="login-password">Password</label>
                <input type="password" class="form-control" id="login-password" required autocomplete="current-password" minlength="8" placeholder="••••••••">
            </div>
            <div class="mb-3 d-none" id="confirm-group">
                <label class="form-label" for="login-confirm">Confirm Password</label>
                <input type="password" class="form-control" id="login-confirm" autocomplete="new-password" minlength="8" placeholder="••••••••">
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit" id="login-submit">Sign In</button>
        </form>

        <div class="text-center mt-3">
            <a href="../index.html" class="small text-muted text-decoration-none">&larr; Back to site</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../core/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
