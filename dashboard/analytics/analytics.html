<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css?v=20260912">
    <link rel="stylesheet" href="../core/layout.css">
    <style>
        .an-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(59, 130, 246, 0.15); color: #7db4ff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .an-num { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
        .an-chart { display: flex; align-items: flex-end; gap: 8px; height: 170px; padding-top: 8px; }
        .an-bar {
            flex: 1; min-height: 3px; border-radius: 6px 6px 0 0;
            background: linear-gradient(180deg, #4facfe, #3b82f6);
            transition: filter 0.15s;
        }
        .an-bar:hover { filter: brightness(1.25); }
        .an-bar-labels { display: flex; gap: 8px; margin-top: 6px; }
        .an-bar-labels span { flex: 1; text-align: center; font-size: 0.62rem; color: #888; }
        .an-list { list-style: none; margin: 0; padding: 0; }
        .an-list li {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
        }
        .an-list li:last-child { border-bottom: 0; }
        .an-list .an-val { font-weight: 700; color: #7db4ff; font-variant-numeric: tabular-nums; }
        .an-list .an-empty { color: #888; justify-content: center; padding: 24px 16px; }
    </style>
    <link rel="manifest" href="/dashboard/manifest.webmanifest">
    <meta name="theme-color" content="#0b0e14">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=3">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="dash-body">

    <div id="sidebar-root"></div>
    <div id="topbar-root"></div>

    <main class="dash-main">
        <div id="page-content"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../core/api.js"></script>
    <script src="../core/ui.js"></script>
    <script src="../core/auth-guard.js"></script>
    <script src="../core/layout.js"></script>
    <script src="analytics.js"></script>
</body>
</html>
