name: Deploy

# This workflow stays dormant until you opt in.
#
# 1. Create a Cloudflare API token with the "Cloudflare Pages: Edit" permission
#    at https://dash.cloudflare.com/profile/api-tokens
# 2. Add two repository secrets (Settings -> Secrets and variables -> Actions):
#      CLOUDFLARE_API_TOKEN
#      CLOUDFLARE_ACCOUNT_ID
# 3. Add a repository *variable* (same page, "Variables" tab):
#      CLOUDFLARE_DEPLOY_ENABLED = true
#
# Until step 3 is done, this job is skipped rather than failing, so a fresh
# clone of the template never shows a red X.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Stage public files and run the security check
        run: node scripts/deploy.js --check

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --branch main --commit-dirty=true
