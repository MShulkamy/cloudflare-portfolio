<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Your Name</title>

    <meta name="description" content="Articles by Your Name about Flutter, mobile development and learning in public.">
    <meta name="theme-color" content="#0b0e14">
    <link rel="canonical" href="https://your-project.pages.dev/blog/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-project.pages.dev/blog/">
    <meta property="og:title" content="Blog — Your Name">
    <meta property="og:description" content="Articles about Flutter, mobile development and learning in public.">
    <meta property="og:image" content="https://your-project.pages.dev/assets/og-cover.jpg">

    <link rel="icon" href="/assets/favicon.svg?v=3" type="image/svg+xml">

    <script>
        // تطبيق الثيم واللغة المحفوظين فوراً (من غير أي وميض)
        (function () {
            try {
                var t = localStorage.getItem('site-theme');
                if (t) document.documentElement.setAttribute('data-bs-theme', t);
                var l = localStorage.getItem('site-lang') || 'en';
                document.documentElement.lang = l;
                if (l === 'ar') document.documentElement.dir = 'rtl';
            } catch (e) { }
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css?v=20260912">
    <link rel="stylesheet" href="/vendor/devicon/devicon.min.css?v=20260912">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/blog.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <img src="/assets/logo.svg" alt="MS Logo" style="height: 40px; width: 40px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));">
                <span class="text-gradient">Portfolio</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link" href="/" data-blog-i18n data-ar="الرئيسية">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/#projects" data-blog-i18n data-ar="المشاريع">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/blog/" data-blog-i18n data-ar="المدونة">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="/#contact" data-blog-i18n data-ar="تواصل معي">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button id="blog-lang-toggle" class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2">
                        <i class="bi bi-globe"></i> <span>عربي</span>
                    </button>
                    <button id="blog-theme-toggle" class="btn btn-sm btn-outline-light rounded-circle p-2 lh-1" aria-label="Theme">
                        <i class="bi bi-circle-half"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="blog-page">
        <div class="container">
            <header class="blog-header text-center" data-blog-i18n data-ar-h1="المدونة" data-ar-p="مقالات عن فلاتر وتطوير الموبايل ورحلتي في التعلم.">
                <h1 class="display-5">Blog</h1>
                <p class="text-muted">Articles about Flutter, mobile development and learning in public.</p>
            </header>

            <div id="blog-list" class="blog-grid">
                <div class="blog-empty"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</div>
            </div>
        </div>
    </main>

    <footer class="blog-footer text-center">
        <div class="container">
            © <span id="year"></span> Your Name
        </div>
    </footer>

    <script>
        // تعريب عناصر الناف بار والعناوين لو اللغة عربي (من غير وميض)
        (function () {
            var l = localStorage.getItem('site-lang') || 'en';
            if (l !== 'ar') return;
            document.querySelectorAll('[data-blog-i18n]').forEach(function (el) {
                if (el.hasAttribute('data-ar-h1')) {
                    var h = el.querySelector('h1'); if (h) h.textContent = el.getAttribute('data-ar-h1');
                    var p = el.querySelector('p'); if (p) p.textContent = el.getAttribute('data-ar-p');
                } else if (el.hasAttribute('data-ar')) {
                    el.textContent = el.getAttribute('data-ar');
                }
            });
        })();
        document.getElementById('year').textContent = new Date().getFullYear();
        document.getElementById('blog-theme-toggle').addEventListener('click', function () {
            var cur = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', cur);
            try { localStorage.setItem('site-theme', cur); } catch (e) { }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/blog.js"></script>
    <script src="/js/track.js"></script>
</body>
</html>
